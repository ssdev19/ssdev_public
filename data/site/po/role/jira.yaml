---
profile::java::version: 'latest'
profile::java::distribution: 'jre'
profile::java::java_home: '/usr/java/jdk-11.0.2+9-jre' #'/usr/java/jdk-11.0.2+9'
profile::java::j_version: '11'
profile::java::jre_version: '11'
profile::java::jdk_version: '8'
profile::java::version_major: '11.0.2'
profile::java::version_minor: '9'
profile::java::java_path: '/usr/java/jdk-11.0.2+9-jre/bin:$PATH'
profile::java::mem: '-Xmx1g'
# Jira
jira::version:       '9.12.13'
# parent directories must exist
jira::installdir:    '/opt/atlassian/atlassian-jira'
jira::homedir:       '/opt/atlassian/application-data/jira-home'
jira::user:          'jira'
jira::group:         'jira'
jira::shell:         '/bin/bash'
jira::dbserver:      '127.0.0.1'
jira::javahome:      '/usr/java'
jira::java_opts: >-
  -Dhttp.proxyHost=jira-ssdev.us.lsst.org
  -Dhttp.proxyPort=8080
  -Dhttps.proxyHost=jira-ssdev.us.lsst.org
  -Dhttps.proxyPort=8080
  -Dhttp.nonProxyHosts=localhost\|127.0.0.1\|172.*.*.*\|10.*.*.*
  -XX:+UseLargePages
jira::dbport:        '5439'
jira::dbuser:        'jira'
jira::jvm_xms:       '1G'
jira::jvm_xmx:       '3G'
jira::service_manage: false
jira::env:
  - 'http_proxy=jira-ssdev.us.lsst.org:8080'
  - 'https_proxy=jira-ssdev.us.lsst.org:8080'
jira::proxy:
  scheme:    'https'
  proxyName: 'jira-ssdev.us.lsst.org'
  proxyPort: '443'
jira::contextpath: '/jira'
jira::tomcat_additional_connectors:
  8181:
    relaxedPathChars: '[]|'
    relaxedQueryChars: '[]|{}^&#x5c;&#x60;&quot;&lt;&gt;'
    maxThreads: '150'
    minSpareThreads: '25'
    connectionTimeout: '20000'
    enableLookups: 'false'
    maxHttpHeaderSize: '8192'
    protocol: 'HTTP/1.1'
    useBodyEncodingForURI: 'true'
    redirectPort: '8443'
    acceptCount: '100'
    disableUploadTimeout: 'true'
    bindOnInit: 'false'
